<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | Habit Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="auth-body">
    <div class="auth-page">
      <div class="auth-card">
        <h2>Create account</h2>
        <p>Build a better routine and stay consistent.</p>

        <form id="registerForm">
          <div class="form-group">
            <label for="registerName">Full Name</label>
            <input id="registerName" type="text" placeholder="Your name" required />
          </div>

          <div class="form-group">
            <label for="registerEmail">Email</label>
            <input id="registerEmail" type="email" placeholder="you@example.com" required />
          </div>

          <div class="form-group">
            <label for="registerPassword">Password</label>
            <input id="registerPassword" type="password" placeholder="Minimum 6 characters" required />
          </div>

          <div class="auth-actions">
            <button type="submit" class="primary-btn">Register</button>
            <div id="registerMessage" class="form-message"></div>
          </div>
        </form>

        <div class="auth-switch">
          Already have an account? <a href="login.html">Log in</a>
        </div>
      </div>
    </div>

    <script src="config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
