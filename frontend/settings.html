<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings | Habit Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-badge">✓</div>
          <span>Habit Tracker</span>
        </div>

        <nav class="nav-menu">
          <a class="nav-item" href="dashboard.html"><span class="nav-icon">🏠</span> Dashboard</a>
          <a class="nav-item" href="habits.html"><span class="nav-icon">🧩</span> Habits</a>
          <a class="nav-item" href="calendar.html"><span class="nav-icon">📅</span> Calendar</a>
          <a class="nav-item" href="statistics.html"><span class="nav-icon">📊</span> Statistics</a>
          <a class="nav-item active" href="settings.html"><span class="nav-icon">⚙️</span> Settings</a>
          <a class="nav-item" href="login.html"><span class="nav-icon">🔒</span> Logout</a>
        </nav>

        <div class="sidebar-footer">
          <div class="user-pill">
            <div class="avatar" id="userAvatar">U</div>
            <div>
              <div id="sidebarUserName">User</div>
              <small id="sidebarUserEmail">user@email.com</small>
            </div>
          </div>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div class="page-title">
            <h1>Settings</h1>
            <p>Update application preferences.</p>
          </div>
          <div class="top-actions">
            <button id="themeToggle" class="icon-button" type="button">🌙</button>
          </div>
        </header>

        <div class="page-card">
          <div class="form-group">
            <label for="themeSelect">Appearance</label>
            <select id="themeSelect">
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
          </div>

          <div class="form-actions">
            <button id="saveThemeBtn" class="primary-btn" type="button">Save Theme</button>
            <button id="logoutBtn" class="secondary-btn" type="button">Logout</button>
          </div>
        </div>
      </main>
    </div>

    <script src="config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
