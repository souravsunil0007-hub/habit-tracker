<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Habit Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="auth-body">
    <div class="auth-page">
      <div class="auth-card">
        <h2>Welcome back</h2>
        <p>Log in to manage your habits and progress.</p>

        <form id="loginForm">
          <div class="form-group">
            <label for="loginEmail">Email</label>
            <input id="loginEmail" type="email" placeholder="you@example.com" required />
          </div>

          <div class="form-group">
            <label for="loginPassword">Password</label>
            <input id="loginPassword" type="password" placeholder="••••••••" required />
          </div>

          <div class="auth-actions">
            <button type="submit" class="primary-btn">Log In</button>
            <div id="loginMessage" class="form-message"></div>
          </div>
        </form>

        <div class="auth-switch">
          Need an account? <a href="register.html">Create one</a>
        </div>
      </div>
    </div>

    <script src="config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
